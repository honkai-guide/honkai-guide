# Based on the file auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
  # Allows a manual redeploy from the Actions tab without an empty commit.
  workflow_dispatch:
# Deploys to live run one at a time, in order. Not cancel-in-progress: a queued
# deploy should not abort the one already uploading to production.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The project's verification loop, so a broken build cannot reach production.
      # eslint is invoked directly rather than via `npm run lint`, which passes --fix.
      - run: npm run test
      - run: npm run type-check
      - run: npx eslint .
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HONKAI_GUIDE }}
          channelId: live
          projectId: honkai-guide
