# Based on the file auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
# One preview per PR: a new push supersedes the build still running for it.
concurrency:
  group: firebase-hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build_and_preview:
    # Secrets are not exposed to pull requests from forks, so those are skipped.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The project's verification loop. eslint is invoked directly rather than via
      # `npm run lint`, which passes --fix.
      - run: npm run test
      - run: npm run type-check
      - run: npx eslint .
      - run: npm run build
      # No channelId: the action creates a per-PR preview channel and comments its URL.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HONKAI_GUIDE }}
          projectId: honkai-guide
